name: alvaro-ai

# Duas redes: "edge" (única exposta, só o Nginx) e "internal" (sem acesso externo: banco, API, monitoramento).
networks:
  edge: {}
  internal:
    internal: true
  egress: {} # saída para Gemini/Supabase/R2 (somente a API)

volumes:
  pgdata: {}
  backups: {}
  prometheus-data: {}
  grafana-data: {}
  loki-data: {}
  nginx-logs: {}

secrets:
  db_password:    { file: ./secrets/db_password.txt }
  jwt_secret:     { file: ./secrets/jwt_secret.txt }
  doc_signing:    { file: ./secrets/document_signing_secret.txt }
  gemini_api_key: { file: ./secrets/gemini_api_key.txt }
  grafana_admin:  { file: ./secrets/grafana_admin_password.txt }

x-logging: &json-logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  # ------------------------------------------------------------------ BANCO
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-alvaro}
      POSTGRES_USER: ${DB_USER:-alvaro}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [internal]
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "log_min_duration_statement=250", "-c", "log_connections=on", "-c", "max_connections=100"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-alvaro} -d ${DB_NAME:-alvaro}"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy: { resources: { limits: { cpus: "1.0", memory: 512M } } }
    logging: *json-logging

  # -------------------------------------------- API (inclui o agente de IA / RAG)
  api:
    build: { context: ./app/backend }
    image: alvaro-api:${APP_VERSION:-1.0.0}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_AUTH_PROVIDER: ${APP_AUTH_PROVIDER:-supabase}   # "local" só para ambiente de avaliação/teste de carga
      PORT: "3001"
      METRICS_PORT: "9100"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: db
      DB_NAME: ${DB_NAME:-alvaro}
      DB_USER: ${DB_USER:-alvaro}
      DB_POOL: ${DB_POOL:-10}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      AUTH_REDIRECT_URL: ${AUTH_REDIRECT_URL:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-alvaro-ai-storage}
      DB_PASSWORD_FILE: /run/secrets/db_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      DOCUMENT_SIGNING_SECRET_FILE: /run/secrets/doc_signing
      GEMINI_API_KEY_FILE: /run/secrets/gemini_api_key
    secrets: [db_password, jwt_secret, doc_signing, gemini_api_key]
    networks: [internal, egress]
    read_only: false
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy: { resources: { limits: { cpus: "1.0", memory: 512M } } }
    logging: *json-logging

  # --------------------------------------- PROXY REVERSO (único ponto de entrada)
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${PUBLIC_HTTPS_PORT:-8443}:443"
      - "${PUBLIC_HTTP_PORT:-8080}:80"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://localhost:8443}
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
      - ./infra/nginx/htpasswd:/etc/nginx/htpasswd:ro
      - nginx-logs:/var/log/nginx
    command: ["/bin/sh", "-c", "envsubst '$$PUBLIC_ORIGIN' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && exec nginx -g 'daemon off;' "]
    networks: [edge, internal]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 3
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETGID, SETUID]
    logging: *json-logging

  # ------------------------------------------------------------ OBSERVABILIDADE
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [internal]
    logging: *json-logging

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: db:5432/${DB_NAME:-alvaro}?sslmode=disable
      DATA_SOURCE_USER: ${DB_USER:-alvaro}
      DATA_SOURCE_PASS_FILE: /run/secrets/db_password
    secrets: [db_password]
    depends_on: { db: { condition: service_healthy } }
    networks: [internal]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: false
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [internal]

  loki:
    image: grafana/loki:3.1.1
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./infra/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks: [internal]

  promtail:
    image: grafana/promtail:3.1.1
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./infra/loki/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [internal]
    depends_on: [loki]

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin
      GF_SERVER_ROOT_URL: ${PUBLIC_ORIGIN:-https://localhost:8443}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    secrets: [grafana_admin]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [internal]
    depends_on: [prometheus, loki]

  # ----------------------------------------------------------- BACKUP AUTOMÁTICO
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${DB_USER:-alvaro}
      PGDATABASE: ${DB_NAME:-alvaro}
      PGPASSWORD_FILE: /run/secrets/db_password
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-21600}   # 6h  => RPO <= 6h
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    secrets: [db_password]
    volumes:
      - backups:/backups
      - ./scripts/backup-loop.sh:/usr/local/bin/backup-loop.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup-loop.sh"]
    networks: [internal]
    depends_on: { db: { condition: service_healthy } }
    logging: *json-logging
