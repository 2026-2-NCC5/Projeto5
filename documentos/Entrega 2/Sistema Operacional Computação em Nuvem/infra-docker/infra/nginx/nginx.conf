worker_processes auto;
events { worker_connections 1024; }

http {
  # Access log estruturado (JSON) -> coletado pelo Promtail/Loki
  log_format json escape=json '{"ts":"$time_iso8601","service":"nginx","remote_addr":"$remote_addr","method":"$request_method",'
    '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time","request_id":"$request_id","ua":"$http_user_agent"}';
  access_log /dev/stdout json;
  error_log  /dev/stderr warn;

  server_tokens off;
  limit_req_zone  $binary_remote_addr zone=api:10m rate=300r/s;
  limit_req_zone  $binary_remote_addr zone=login:10m rate=10r/m;
  limit_conn_zone $binary_remote_addr zone=conn:10m;

  upstream api      { server api:3001; keepalive 32; }
  upstream grafana  { server grafana:3000; }

  server {
    listen 80;
    location = /nginx-health { access_log off; return 200 "ok\n"; }
    location / { return 301 ${PUBLIC_ORIGIN}$request_uri; }
  }

  server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 25m;       # alinhado ao limite do express.json
    limit_conn conn 50;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;       # chamadas ao Gemini podem demorar

    # --- API (acesso público controlado por JWT + rate-limit) ---
    location /api/ {
      limit_req zone=api burst=300 nodelay;
      proxy_pass http://api;
    }
    location = /api/auth/login {
      limit_req zone=login burst=5 nodelay;   # mitiga força bruta
      proxy_pass http://api;
    }

    # --- Painel de monitoramento: HTTP Basic (camada extra) + login do Grafana ---
    location /grafana/ {
      auth_basic "Monitoramento";
      auth_basic_user_file /etc/nginx/htpasswd;
      proxy_pass http://grafana;
      proxy_set_header Authorization "";   # não repassa credenciais Basic ao Grafana
    }

    # Bloqueia explicitamente qualquer tentativa de alcançar métricas pelo proxy
    location ~ ^/(metrics|prometheus) { return 404; }
    location = / { return 200 "Alvaro AI - API. Use /api/health\n"; add_header Content-Type text/plain; }
  }
}
